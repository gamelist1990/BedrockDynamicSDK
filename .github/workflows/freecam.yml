name: Freecam underground view
on:
  push:
    branches: [codex/freecam-cube-render]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure MSVC Release x64
        shell: pwsh
        run: |
          cmake -S exsample/Freecam -B build-freecam -A x64 "-DFETCHCONTENT_SOURCE_DIR_BEDROCK_SDK=$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build DLL
        run: cmake --build build-freecam --config Release --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: Freecam-windows-x64
          path: build-freecam/Release/BedrockFreecam.dll
          if-no-files-found: error
