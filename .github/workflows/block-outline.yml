name: BlockOutline example
on:
  push:
    branches: [main]
    paths:
      - 'exsample/BlockOutline/**'
      - 'include/bedrock/**'
      - 'src/**'
      - 'data/**'
      - 'CMakeLists.txt'
      - '.github/workflows/block-outline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64 Release
        shell: pwsh
        run: |
          cmake -S exsample/BlockOutline -B build-block-outline -A x64 "-DFETCHCONTENT_SOURCE_DIR_BEDROCK_SDK=$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build DLL
        run: cmake --build build-block-outline --config Release --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: BlockOutline-windows-x64
          path: build-block-outline/Release/BedrockBlockOutline.dll
          if-no-files-found: error
