name: Documentation site
on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - 'docs/site/**'
      - 'tools/sitegen/**'
      - 'sdk/include/bedrock/**'
      - 'sdk/ts/node_modules/@bedrock/sdk/index.d.ts'
      - 'data/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  cpp-examples:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build the public C++ quickstart DLL
        shell: pwsh
        run: |
          cmake -S docs/site/quickstart -B build-docs -A x64 "-DSDK_DIR=${{ github.workspace }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-docs --target Hello --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation pages and links
        run: python3 -m unittest discover -s tools/sitegen
      - name: Generate documentation site
        run: |
          python3 tools/sitegen/sitegen.py --out _site
          # The Windows profile updater consumes the public /data/ URLs.
          cp -R data _site/data
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || github.event_name == 'release'
    needs: [build, cpp-examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation site
        id: deployment
        uses: actions/deploy-pages@v5
