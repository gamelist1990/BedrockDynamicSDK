name: Build DLLs and releases
on:
  push:
    branches: [main]
    tags: ['minecraft-*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Minecraft version to embed
        type: choice
        options: ['1.26.60.5', '1.26.65.1']
        default: '1.26.65.1'
      mods:
        description: all, or comma separated Mod names (for example CheckSig,Fake)
        type: string
        default: all
      release:
        description: Create or update this version's release assets
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}-${{ inputs.version || '1.26.65.1' }}-${{ inputs.mods || 'all' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          GAME_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MODS: ${{ inputs.mods || 'all' }}
        run: |
          python3 - <<'PYCODE'
          import os, json
          version = os.environ.get('GAME_VERSION') or ''
          if not version and os.environ.get('REF_TYPE') == 'tag':
              ref = os.environ.get('REF_NAME', '')
              version = ref[len('minecraft-'):] if ref.startswith('minecraft-') else ''
          version = version or '1.26.65.1'
          if version not in ('1.26.60.5', '1.26.65.1'): raise SystemExit('Unsupported version')
          clients = ['HitBox', 'SpeedBuilder']
          tools = ['CheckSig', 'Top']
          if version == '1.26.65.1':
              clients.extend(['DynamicClient', 'AutoMine', 'ScriptClient'])
              tools.extend(['BlockProbe', 'CraftProbe', 'InputProbe', 'StackProbe', 'Fake', 'GlobalResourcePack', 'ModSettingsDemo'])
          available = clients + tools
          selected = available if os.environ['MODS'] == 'all' else list(dict.fromkeys(x.strip() for x in os.environ['MODS'].split(',')))
          if not selected or any(x not in available for x in selected): raise SystemExit('Unknown Mod or Mod unavailable for this version')
          matrix = [{'mod': mod, 'source': 'exsample/' + ('DevClient/' if mod in tools else '') + mod} for mod in selected]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'include': matrix}) + '\nversion=' + version + '\n')
          PYCODE
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install TypeScript compiler for the Stage C tests
        run: npm install -g typescript@5.9.3
      - name: Verify data and Python
        run: |
          uv sync --extra dev
          uv run --extra dev pytest -q
          uv run bedrock-symbols index data --output /tmp/manifest-generated.json
          cmp data/manifest.json /tmp/manifest-generated.json
      - name: Build and test C++ core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile embedded hook runtime and tests with MSVC
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build resource pack example for 1.26.65.1
        shell: pwsh
        run: |
          cmake -S exsample/DevClient/GlobalResourcePack -B build-brpm -A x64 "-DFETCHCONTENT_SOURCE_DIR_BEDROCK_SDK=$env:GITHUB_WORKSPACE" "-DBEDROCK_GAME_VERSION=1.26.65.1" -DBEDROCK_BUILD_ID=${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-brpm --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-brpm -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GlobalResourcePack-windows-smoke
          path: |
            build-brpm/Release/GlobalResourcePack.dll
            exsample/DevClient/GlobalResourcePack/README_ja.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockDynamicSDK-windows-x64
          path: |
            build/Release/BedrockHookRuntime.dll
            build/Release/BedrockSymbolProbe.dll
            build/Release/BedrockClientLocator.dll
          if-no-files-found: error

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build opt-in DirectX11 GUI module
        shell: pwsh
        run: |
          cmake -S . -B build-gui -A x64 -DBEDROCK_SDK_ENABLE_GUI=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-gui --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Opt-in in-game overlay must also compile on MSVC, not just GuiHost.
          if (!(Test-Path "build-gui/gui/Release/bedrock_gui_overlay.lib")) {
            throw "Missing bedrock_gui_overlay.lib"
          }
          ctest --test-dir build-gui -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  mods:
    needs: plan
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - name: Configure MSVC x64 Release
        shell: pwsh
        run: |
          $extraArgs = @()
          if ("${{ matrix.mod }}" -eq "CheckSig") { $extraArgs += "-DCHECKSIG_BUILD_TESTS=ON" }
          cmake -S "${{ matrix.source }}" -B build-mod -A x64 "-DFETCHCONTENT_SOURCE_DIR_BEDROCK_SDK=$env:GITHUB_WORKSPACE" -DBEDROCK_HITBOX_BUILD_ID=${{ github.sha }} -DBEDROCK_BUILD_ID=${{ github.sha }} "-DBEDROCK_GAME_VERSION=${{ needs.plan.outputs.version }}" @extraArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build-mod --config Release --parallel 2
      - name: Mod input and DLL smoke tests
        if: matrix.mod == 'CheckSig' || matrix.mod == 'GlobalResourcePack' || matrix.mod == 'DynamicClient'
        run: ctest --test-dir build-mod -C Release --output-on-failure
      - name: CheckSig profile installer tests (Windows PowerShell 5.1)
        if: matrix.mod == 'CheckSig'
        env:
          CHECKSIG_PROFILE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: powershell
        run: ./exsample/DevClient/CheckSig/tests/profile_installer_test.ps1
      - name: Verify CheckSig DLL
        if: matrix.mod == 'CheckSig'
        shell: pwsh
        run: |
          if (!(Test-Path "build-mod/Release/CheckSig.dll")) {
            throw "CheckSig.dll was not produced"
          }
      - name: Package CheckSig usage and profile tools
        if: matrix.mod == 'CheckSig'
        shell: pwsh
        run: |
          Copy-Item exsample/DevClient/CheckSig/README_ja.md build-mod/Release/
          Copy-Item exsample/DevClient/CheckSig/Get-CheckSigProfile.ps1 build-mod/Release/
          Copy-Item docs/checksig-jobs.md build-mod/Release/
          Copy-Item docs/checksig-126605.md build-mod/Release/
          Copy-Item docs/checksig-auto-dev.md build-mod/Release/
          if ("${{ needs.plan.outputs.version }}" -eq "1.26.60.5") {
            python tools/checksig_investigation.py --bundle build-investigation
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            New-Item -ItemType Directory -Force release | Out-Null
            Copy-Item build-investigation/commands/1.26.60.5-all-mods.json build-mod/Release/
            Copy-Item build-investigation/commands/1.26.60.5-all-mods.json release/
            Compress-Archive -Path build-investigation/* -DestinationPath release/CheckSig-Investigation-1.26.60.5.zip
          }
      - name: Package Fake usage
        if: matrix.mod == 'Fake'
        shell: pwsh
        run: |
          if (!(Test-Path "build-mod/Release/Fake.dll")) { throw "Fake.dll was not produced" }
          Copy-Item exsample/DevClient/Fake/README_ja.md build-mod/Release/
          Copy-Item docs/command-requests.md build-mod/Release/
      - name: Package resource pack example usage
        if: matrix.mod == 'GlobalResourcePack'
        shell: pwsh
        run: Copy-Item exsample/DevClient/GlobalResourcePack/README_ja.md build-mod/Release/
      - name: Package DynamicClient usage and notices
        if: matrix.mod == 'DynamicClient'
        shell: pwsh
        run: |
          Copy-Item exsample/DynamicClient/README.md build-mod/Release/
          Copy-Item exsample/DynamicClient/LICENSE.Zoom build-mod/Release/LICENSE.Zoom.txt
      - name: Package ScriptClient usage and guide
        if: matrix.mod == 'ScriptClient'
        shell: pwsh
        run: |
          if (!(Test-Path "build-mod/Release/ScriptClient.dll")) { throw "ScriptClient.dll was not produced" }
          Copy-Item exsample/ScriptClient/README.md build-mod/Release/
          Copy-Item docs/scriptclient.md build-mod/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-${{ needs.plan.outputs.version }}-windows-x64
          path: |
            build-mod/Release/*.dll
            build-mod/Release/BedrockHitBoxLoader.exe
            build-mod/Release/*.md
            build-mod/Release/LICENSE.Zoom.txt
            build-mod/Release/Get-CheckSigProfile.ps1
          if-no-files-found: error
      - name: Package release ZIP
        shell: pwsh
        env:
          MOD: ${{ matrix.mod }}
          GAME_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "data/$env:GAME_VERSION/windows-x64" build-mod/Release/profile -Recurse
          @{ mod = $env:MOD; game_version = $env:GAME_VERSION; source_sha = "${{ github.sha }}"; architecture = "windows-x64" } | ConvertTo-Json | Set-Content -Encoding utf8 build-mod/Release/build-info.json
          $files = Get-ChildItem build-mod/Release -File | Where-Object { $_.Extension -in '.dll', '.exe', '.md', '.ps1', '.json', '.txt' }
          Compress-Archive -Path ($files.FullName + @((Join-Path $PWD "build-mod/Release/profile"))) -DestinationPath "release/$env:MOD-$env:GAME_VERSION-windows-x64.zip"
          $zip = Get-Item "release/$env:MOD-$env:GAME_VERSION-windows-x64.zip"
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "### $env:MOD" >> $env:GITHUB_STEP_SUMMARY
          "$($zip.Name) — $([math]::Round($zip.Length / 1MB, 2)) MB — sha256 $hash" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.mod }}-${{ needs.plan.outputs.version }}
          path: |
            release/*.zip
            release/*.json
          if-no-files-found: error

  release:
    # Runs when a release is requested manually, or automatically when a
    # minecraft-<version> tag is pushed.
    if: (github.event_name == 'workflow_dispatch' && inputs.release) || github.ref_type == 'tag'
    needs: [plan, mods, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ needs.plan.outputs.version }}
          path: release
          merge-multiple: true
      - name: Generate release notes and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag="minecraft-$GAME_VERSION"
          prev=""
          if gh release view "$tag" >/dev/null 2>&1; then
            body=$(gh release view "$tag" --json body --jq .body)
            prev=$(printf '%s' "$body" | grep -oE 'build-commit: [0-9a-f]{40}' | grep -oE '[0-9a-f]{40}' || true)
            if [ -z "$prev" ]; then
              prev=$(printf '%s' "$body" | grep -oE 'Build commit: [0-9a-f]{40}' | grep -oE '[0-9a-f]{40}' || true)
            fi
          fi
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
            git log --oneline "$prev..$SOURCE_SHA" > changes.txt
          else
            git log --oneline -20 "$SOURCE_SHA" > changes.txt
          fi
          prerelease_flag=""
          if [ "$GAME_VERSION" = "1.26.60.5" ]; then prerelease_flag="--prerelease"; fi
          python3 tools/release_notes.py --dir release --version "$GAME_VERSION" --sha "$SOURCE_SHA" --repo "${{ github.repository }}" --changes changes.txt --out release-notes.md --sums release/SHA256SUMS.txt $prerelease_flag
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update version release
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag="minecraft-$GAME_VERSION"
          flags=()
          if [ "$GAME_VERSION" = "1.26.60.5" ]; then flags+=(--prerelease); fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --title "Minecraft $GAME_VERSION" --notes-file release-notes.md "${flags[@]}"
          else
            gh release edit "$tag" --title "Minecraft $GAME_VERSION" --notes-file release-notes.md "${flags[@]}"
          fi
          gh release upload "$tag" release/* --clobber
