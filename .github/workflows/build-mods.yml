name: Build DLLs and releases
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Minecraft version to embed
        type: choice
        options: ['1.26.52.3', '1.26.60.5']
        default: '1.26.52.3'
      mods:
        description: all, or comma separated Mod names (for example CheckSig,Fake)
        type: string
        default: all
      release:
        description: Create or update this version's release assets
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}-${{ inputs.version || '1.26.52.3' }}-${{ inputs.mods || 'all' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          GAME_VERSION: ${{ inputs.version || '1.26.52.3' }}
          MODS: ${{ inputs.mods || 'all' }}
        run: |
          python3 - <<'PYCODE'
          import os, json
          version = os.environ['GAME_VERSION']
          if version not in ('1.26.52.3', '1.26.60.5'): raise SystemExit('Unsupported version')
          available = ['Freecam','SpeedBuilder','Top','HitBox','TabList','Zoom','AutoSprint','CheckSig']
          if version == '1.26.60.5': available.append('Fake')
          selected = available if os.environ['MODS'] == 'all' else list(dict.fromkeys(x.strip() for x in os.environ['MODS'].split(',')))
          if not selected or any(x not in available for x in selected): raise SystemExit('Unknown Mod or Mod unavailable for this version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'mod': selected}) + '\nversion=' + version + '\n')
          PYCODE
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify data and Python
        run: |
          uv sync --extra dev
          uv run --extra dev pytest -q
          uv run bedrock-symbols index data --output /tmp/manifest-generated.json
          cmp data/manifest.json /tmp/manifest-generated.json
      - name: Build and test C++ core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile embedded hook runtime and tests with MSVC
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockDynamicSDK-windows-x64
          path: |
            build/Release/BedrockHookRuntime.dll
            build/Release/BedrockSymbolProbe.dll
            build/Release/BedrockClientLocator.dll
          if-no-files-found: error

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build opt-in DirectX11 GUI module
        shell: pwsh
        run: |
          cmake -S . -B build-gui -A x64 -DBEDROCK_SDK_ENABLE_GUI=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-gui --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Opt-in in-game overlay must also compile on MSVC, not just GuiHost.
          if (!(Test-Path "build-gui/gui/Release/bedrock_gui_overlay.lib")) {
            throw "Missing bedrock_gui_overlay.lib"
          }
          ctest --test-dir build-gui -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  mods:
    needs: plan
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure MSVC x64 Release
        shell: pwsh
        run: |
          $extraArgs = @()
          if ("${{ matrix.mod }}" -eq "CheckSig") { $extraArgs += "-DCHECKSIG_BUILD_TESTS=ON" }
          cmake -S exsample/${{ matrix.mod }} -B build-mod -A x64 "-DFETCHCONTENT_SOURCE_DIR_BEDROCK_SDK=$env:GITHUB_WORKSPACE" -DBEDROCK_HITBOX_BUILD_ID=${{ github.sha }} -DBEDROCK_BUILD_ID=${{ github.sha }} "-DBEDROCK_GAME_VERSION=${{ needs.plan.outputs.version }}" @extraArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build-mod --config Release --parallel 2
      - name: CheckSig input and DLL smoke tests
        if: matrix.mod == 'CheckSig'
        run: ctest --test-dir build-mod -C Release --output-on-failure
      - name: CheckSig profile installer tests (Windows PowerShell 5.1)
        if: matrix.mod == 'CheckSig'
        shell: powershell
        run: ./exsample/CheckSig/tests/profile_installer_test.ps1
      - name: Verify CheckSig DLL
        if: matrix.mod == 'CheckSig'
        shell: pwsh
        run: |
          if (!(Test-Path "build-mod/Release/CheckSig.dll")) {
            throw "CheckSig.dll was not produced"
          }
      - name: Package CheckSig usage and profile tools
        if: matrix.mod == 'CheckSig'
        shell: pwsh
        run: |
          Copy-Item exsample/CheckSig/README_ja.md build-mod/Release/
          Copy-Item exsample/CheckSig/Get-CheckSigProfile.ps1 build-mod/Release/
          Copy-Item docs/checksig-jobs.md build-mod/Release/
          Copy-Item docs/checksig-126605.md build-mod/Release/
          Copy-Item docs/checksig-auto-dev.md build-mod/Release/
          if ("${{ needs.plan.outputs.version }}" -eq "1.26.60.5") {
            python tools/checksig_investigation.py --bundle build-investigation
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            New-Item -ItemType Directory -Force release | Out-Null
            Copy-Item build-investigation/commands/1.26.60.5-all-mods.json build-mod/Release/
            Copy-Item build-investigation/commands/1.26.60.5-all-mods.json release/
            Compress-Archive -Path build-investigation/* -DestinationPath release/CheckSig-Investigation-1.26.60.5.zip
          }
      - name: Package Fake usage
        if: matrix.mod == 'Fake'
        shell: pwsh
        run: |
          if (!(Test-Path "build-mod/Release/Fake.dll")) { throw "Fake.dll was not produced" }
          Copy-Item exsample/Fake/README_ja.md build-mod/Release/
          Copy-Item docs/command-requests.md build-mod/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-${{ needs.plan.outputs.version }}-windows-x64
          path: |
            build-mod/Release/*.dll
            build-mod/Release/BedrockHitBoxLoader.exe
            build-mod/Release/*.md
            build-mod/Release/Get-CheckSigProfile.ps1
          if-no-files-found: error
      - name: Package release ZIP
        shell: pwsh
        env:
          MOD: ${{ matrix.mod }}
          GAME_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "data/$env:GAME_VERSION/windows-x64" build-mod/Release/profile -Recurse
          @{ mod = $env:MOD; game_version = $env:GAME_VERSION; source_sha = "${{ github.sha }}"; architecture = "windows-x64" } | ConvertTo-Json | Set-Content -Encoding utf8 build-mod/Release/build-info.json
          $files = Get-ChildItem build-mod/Release -File | Where-Object { $_.Extension -in '.dll', '.exe', '.md', '.ps1', '.json' }
          Compress-Archive -Path ($files.FullName + @((Join-Path $PWD "build-mod/Release/profile"))) -DestinationPath "release/$env:MOD-$env:GAME_VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.mod }}-${{ needs.plan.outputs.version }}
          path: |
            release/*.zip
            release/*.json
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [plan, mods, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ needs.plan.outputs.version }}
          path: release
          merge-multiple: true
      - name: Update version release
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag="minecraft-$GAME_VERSION"
          flags=()
          if [ "$GAME_VERSION" = "1.26.60.5" ]; then flags+=(--prerelease); fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --title "Minecraft $GAME_VERSION" --notes "Windows x64 DLLs. See README for feature verification scope. Native ABI and layouts may remain candidates. Build commit: $SOURCE_SHA" "${flags[@]}"
          fi
          gh release upload "$tag" release/* --clobber
