name: SpeedBuilder example
on:
  push:
    branches: [codex/speedbuilder-native, codex/freecam-speedbuilder-live-fixes]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure MSVC Release x64
        shell: pwsh
        run: |
          cmake -S exsample/SpeedBuilder -B build-speedbuilder -A x64 "-DFETCHCONTENT_SOURCE_DIR_BEDROCK_SDK=$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build DLL
        run: cmake --build build-speedbuilder --config Release --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedBuilder-windows-x64
          path: build-speedbuilder/Release/BedrockSpeedBuilder.dll
          if-no-files-found: error
