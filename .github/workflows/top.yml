name: Top example
on:
  push:
    branches: [codex/freecam-spectator-render-path]
    paths:
      - 'exsample/Top/**'
      - 'include/bedrock/**'
      - 'CMakeLists.txt'
      - 'data/**'
      - 'include/bedrock/generated_symbols.hpp'
      - '.github/workflows/top.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure MSVC Release x64
        shell: pwsh
        run: |
          cmake -S exsample/Top -B build-top -A x64 "-DFETCHCONTENT_SOURCE_DIR_BEDROCK_SDK=$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build DLL
        run: cmake --build build-top --config Release --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: Top-windows-x64
          path: build-top/Release/BedrockTop.dll
          if-no-files-found: error
