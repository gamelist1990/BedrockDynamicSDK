name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify data and Python
        run: |
          uv sync --extra dev
          uv run --extra dev pytest -q
          uv run bedrock-symbols index data --output /tmp/manifest-generated.json
          cmp data/manifest.json /tmp/manifest-generated.json
      - name: Build and test C++ core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile single DLL and tests with MSVC
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockDynamicSDK-windows-x64
          path: |
            build/Release/BedrockSymbolProbe.dll
            build/Release/BedrockClientLocator.dll
          if-no-files-found: error

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build opt-in DirectX11 GUI module
        shell: pwsh
        run: |
          cmake -S . -B build-gui -A x64 -DBEDROCK_SDK_ENABLE_GUI=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-gui --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-gui -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
