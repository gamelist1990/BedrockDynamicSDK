name: HitBox example
on:
  push:
    paths:
      - 'exsample/HitBox/**'
      - 'include/bedrock/**'
      - 'src/native_actors.cpp'
      - 'data/**'
      - '.github/workflows/hitbox.yml'
  pull_request:
    paths:
      - 'exsample/HitBox/**'
      - 'include/bedrock/**'
      - 'src/native_actors.cpp'
      - 'data/**'
      - '.github/workflows/hitbox.yml'
  workflow_dispatch:

jobs:
  windows-dll:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S exsample/HitBox -B build-hitbox -A x64 -DBEDROCK_SDK_REF=main
      - name: Build
        run: cmake --build build-hitbox --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockHitBox-windows-x64
          path: build-hitbox/Release/BedrockHitBox.dll
          if-no-files-found: error
