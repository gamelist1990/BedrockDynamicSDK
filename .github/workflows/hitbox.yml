name: HitBox example
on:
  push:
    paths:
      - 'exsample/HitBox/**'
      - 'include/bedrock/**'
      - 'src/native_actors.cpp'
      - 'data/**'
      - '.github/workflows/hitbox.yml'
  pull_request:
    paths:
      - 'exsample/HitBox/**'
      - 'include/bedrock/**'
      - 'src/native_actors.cpp'
      - 'data/**'
      - '.github/workflows/hitbox.yml'
  workflow_dispatch:

jobs:
  windows-dll:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S exsample/HitBox -B build-hitbox -A x64
          "-DFETCHCONTENT_SOURCE_DIR_BEDROCK_SDK=$env:GITHUB_WORKSPACE"
          -DBEDROCK_HITBOX_BUILD_ID=${{ github.sha }}
      - name: Build
        run: cmake --build build-hitbox --config Release --parallel
      - name: Test copied-data processing
        run: ctest --test-dir build-hitbox -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockHitBox-windows-x64
          path: build-hitbox/Release/BedrockHitBox.dll
          if-no-files-found: error
