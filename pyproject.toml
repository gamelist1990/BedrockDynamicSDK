[project]
name = "bedrock-dynamic-sdk"
version = "0.1.0"
description = "Versioned Minecraft Bedrock PE symbol extraction and runtime resolution"
requires-python = ">=3.12"
dependencies = ["pefile>=2024.8.26", "capstone>=5.0.3"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
bedrock-symbols = "bedrock_symbols.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["tools/bedrock_symbols"]
[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
